[project]
name = "hass-z21-control"
version = "0.1.0"
description = "Home Assistant custom integration for Roco Z21-compatible command stations."
# Home Assistant 2026.1 (the hacs.json floor) requires Python >=3.13.2.
requires-python = ">=3.13.2"
# Zero runtime dependencies (pure-Python codec; transport uses stdlib asyncio).
dependencies = []

[project.optional-dependencies]
# pytest-homeassistant-custom-component pulls in homeassistant + voluptuous +
# pytest-asyncio, needed only to exercise the HA config flow. Runtime deps stay
# empty. The pure protocol/client suites remain HA-free.
#
# pttcc is pinned exactly: it hard-pins the Home Assistant version it installs,
# so an open range resolves a different HA per Python version — older pins even
# backtrack to a years-old HA the integration no longer works against. 0.13.305
# pins HA 2026.1.0 (the floor declared in hacs.json) and supports Python 3.13 and
# 3.14. Bump this in lockstep with the hacs.json floor.
dev = ["pytest>=7.0", "pytest-homeassistant-custom-component==0.13.305"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
